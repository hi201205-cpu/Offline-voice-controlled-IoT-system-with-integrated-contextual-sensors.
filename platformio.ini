[platformio]
; Keep PlatformIO firmware sources in src/; web/ is Firebase Hosting content.
src_dir = src

[env:esp32-s3-n16r8]
platform = espressif32 @ ^7.0.0
framework = arduino
board = esp32-s3-devkitc-1

; ── Flash & PSRAM (N16R8) ────────────────────────────────────
board_build.arduino.memory_type = qio_opi
board_build.flash_size          = 16MB
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = partitions_custom.csv


; ── Monitor ──────────────────────────────────────────────────
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize

; ---- Build flags ----
build_flags =
    -DARDUINO_USB_MODE=1
    ;-DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM                          ; Khai báo có PSRAM
    -mfix-esp32-psram-cache-issue
    -O2                                        ; Tối ưu tốc độ
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=0     ; Tắt ESP-NN do thiếu kernel assembly trong thư viện
    ;-DEIDSP_USE_CMSIS_DSP=1                   ; Dùng CMSIS DSP (nhanh hơn)
    ;-DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=1    ; Tăng tốc inference ESP32
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=65536
    -DSTREAM_TASK_STACK_SIZE=16384
    -I lib/KWS-Vietnamese-command_inferencing/src
    -I lib/KWS-Vietnamese-command_inferencing
    -I lib/KWS-Vietnamese-command_inferencing/src/edge-impulse-sdk

lib_deps =
    mobizt/Firebase ESP32 Client @ ^4.4.0 
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.15